# Build the Jupyter Book and deploy it to GitHub Pages.
# Enable Pages in the repository settings: Settings > Pages > Source: "GitHub Actions".
name: deploy-book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # the site is served from https://<user>.github.io/<repository>/
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Jupyter Book
        run: pip install "jupyter-book>=2,<3"
      - name: Build HTML (notebooks are not executed, saved outputs are used)
        run: jupyter-book build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html
      - id: deployment
        uses: actions/deploy-pages@v4
